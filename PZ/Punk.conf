[General]

tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 224.0.0.0/4, 255.255.255.255/32
dns-server = system
fallback-dns-server = 223.5.5.5,119.29.29.29
dns-direct-system = true
dns-direct-fallback-proxy = false
ipv6 = false
compatibility-mode = 3
icmp-auto-reply = true
private-ip-answer = true
allow-dns-svcb = false
hijack-dns = :53
udp-policy-not-supported-behaviour = REJECT
block-quic = always-allow
update-url = https://raw.githubusercontent.com/203081000/Magic/refs/heads/main/PZ/Punk.conf


[Host]

*.apple.com = server:system
*.icloud.com = server:system
localhost = 127.0.0.1


[MITM]

ca-passphrase = Shadowrocket
enable = true


[Proxy Group]

AI = select, policy-regex-filter=(?=.*光年)(?=.*punk).*


